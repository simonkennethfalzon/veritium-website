# /etc/nginx/sites-available/veritium
server {
    listen 80;
    listen [::]:80;
    server_name veritium.com.au www.veritium.com.au;

    root /var/www/veritium;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
